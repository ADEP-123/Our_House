services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Solo se usa si conectas con wallet (DB_WALLET_DIR=/app/wallet)
      - ./wallet:/app/wallet:ro
    healthcheck:
      # Cada consulta toca Oracle, así la Autonomous DB nunca llega a 7 días sin uso
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en el archivo .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
